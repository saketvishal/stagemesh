name: Bug report
description: Report a reproducible StageMesh defect
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please provide deterministic evidence where possible. Do not include credentials, private source code, or sensitive project data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should StageMesh have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands/configuration/steps that reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StageMesh version or commit
      placeholder: 0.2.0a1 or git SHA
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / project discovery
        - Task source / GitHub
        - Planning / objectives
        - Routing / providers
        - Execution / workers
        - Validation
        - Review
        - Integration / git
        - Recovery / restart
        - Documentation
        - Other
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant status output, typed failure, event, or log excerpt with secrets/private data removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private source, and sensitive project data.
          required: true
