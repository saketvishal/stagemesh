name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata and console scripts
        shell: python
        run: |
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("stagemesh-*.whl"))
          sdists = sorted(dist.glob("stagemesh-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found {wheels=} {sdists=}")

          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              entry_points_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/entry_points.txt"))
              metadata = wheel.read(metadata_name).decode()
              entry_points = wheel.read(entry_points_name).decode()
          if "Name: stagemesh" not in metadata:
              raise SystemExit(metadata)
          if "stagemesh = build_coordinator.cli:main" not in entry_points:
              raise SystemExit(entry_points)
          if "build-coordinator = build_coordinator.cli:main" not in entry_points:
              raise SystemExit(entry_points)

          with tarfile.open(sdists[0]) as sdist:
              names = sdist.getnames()
          if not any(name.endswith("/pyproject.toml") for name in names):
              raise SystemExit("sdist is missing pyproject.toml")

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish exact artifacts to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stagemesh/
    permissions:
      id-token: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
