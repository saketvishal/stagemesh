name: StageMesh autonomy regressions

on:
  push:
  pull_request:

jobs:
  autonomy:
    name: autonomy-regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py
      - run: .stagemesh/tooling/venv/bin/python -m pip install pytest
        if: runner.os != 'Windows'
      - run: .stagemesh\tooling\venv\Scripts\python.exe -m pip install pytest
        if: runner.os == 'Windows'
      - name: autonomy regressions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .stagemesh/tooling/venv/Scripts/python.exe -m pytest tests/test_autonomy_*.py -q
          else
            .stagemesh/tooling/venv/bin/python -m pytest tests/test_autonomy_*.py -q
          fi
