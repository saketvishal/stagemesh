name: StageMesh autonomy regressions

on:
  push:
  pull_request:

jobs:
  autonomy:
    name: autonomy-regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: autonomy regressions
        shell: bash
        run: python -m pytest tests/test_autonomy_*.py -q
