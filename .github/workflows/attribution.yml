name: Commit attribution

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  attribution:
    name: Attribution policy
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
    steps:
      # Run only trusted base-branch policy. Never execute PR code or install its dependencies.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          # Read-only credentials are needed to fetch candidates in private repositories.
          # Candidate files are never checked out or executed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch candidate objects without checking them out
        shell: bash
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 2
          git fetch --no-tags origin "$HEAD_SHA"
      - name: Check every incoming commit
        run: python scripts/check_attribution.py --base "$BASE_SHA" --head "$HEAD_SHA"
