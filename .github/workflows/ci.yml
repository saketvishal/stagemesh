name: StageMesh CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run the authoritative complete regression
        required: true
        default: full
        type: choice
        options: [full]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute audited validation plan
        id: validation-plan
        env:
          STAGEMESH_CI_EVENT: ${{ github.event_name }}
          STAGEMESH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          STAGEMESH_CI_FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/ci_validation_plan.py --plan-file .stagemesh-ci-plan.json
      - name: Attribution and static range policy
        env:
          STAGEMESH_CI_EVENT: ${{ github.event_name }}
          STAGEMESH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python scripts/check_ci_range.py
      - run: python scripts/bootstrap_stagemesh.py --editable
      - name: Focused validation policy
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_stagemesh_validation_profile.py tests/test_focused_validation.py tests/test_docs_links.py
      - run: .stagemesh\tooling\venv\Scripts\python.exe -c "import stagemesh; print(stagemesh.__version__)"
      - name: Stabilization matrix
        if: ${{ steps.validation-plan.outputs.mode == 'full' || steps.validation-plan.outputs.mode == 'operator' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe scripts/stabilization_gate.py
      - name: Declarative and executable contract invariants
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_invariant_semantics.py
      - name: Audited component tests
        if: ${{ steps.validation-plan.outputs.mode == 'component' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe scripts/run_ci_component_tests.py --plan .stagemesh-ci-plan.json --os windows
      - name: Delivery and window regressions
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_fast_forward.py tests/test_landing_recovery.py tests/test_run_window.py tests/test_autonomous_window.py tests/test_continuous_capacity.py tests/test_source_sync_preserves_progress.py tests/test_operator_report.py tests/test_handoff.py tests/test_survivor_wave.py tests/test_contract_admission.py tests/test_controlled_merge.py tests/test_candidate_environments.py tests/test_workspace_environment_repair.py tests/test_autonomy_merge_policy.py tests/test_operator_stop.py
      - name: Isolated validation temporary directories
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_gate_temp_isolation.py tests/test_validation_deadline_clock.py tests/test_gate_cleanup_confirmation.py tests/test_active_gate_stop.py tests/test_validation_crash_fence.py tests/test_validation_recovery_ownership.py tests/test_run_ready.py::test_continue_holds_legacy_validation_until_inspected_release tests/test_autonomy_recovery.py tests/test_stage_admission_fence.py tests/test_stage_dispatch_atomic.py tests/test_stage_dispatch_identity.py tests/test_run_ready.py::test_noop_after_failed_review_rechecks_existing_candidate
      - name: Missing provider tool host
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_provider_acceptance.py::test_missing_tool_host_is_not_treated_as_a_working_provider tests/test_provider_acceptance.py::test_missing_tool_host_detection_ignores_ordinary_review_text tests/test_provider_acceptance.py::test_review_git_history_is_readable_without_source_object_access
      - name: Existing queue stop compatibility
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_parallel.py tests/test_queue_run.py -k "stop or pause or interrupt"
      - name: Execution budgets and review ownership
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_bounded_execution.py tests/test_review_terminalization.py tests/test_builtin_execution_ownership.py tests/test_provider_cleanup_confirmation.py tests/test_external_provider_cleanup.py tests/test_concurrent_provider_termination.py tests/test_review_workspace_retention.py tests/test_pid_cleanup_proof.py
      - name: Provider output security boundaries
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_provider_output_security.py
      - name: E2E loop security boundaries
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_e2e_loop_security.py tests/test_e2e_remediation.py tests/test_task_detail_api.py
      - name: Autonomous recovery ledger
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_autonomous_recovery.py tests/test_recovery_ledger.py
      - name: Continuous driver control and recovery
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_continuous_driver.py tests/test_driver_control_races.py tests/test_driver_cleanup_fence.py
      - name: Validation environment and fallback progress
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_diagnosis.py tests/test_run_window_progress.py
      - name: Reliable execution, validation and delivery
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_git_init_encoding.py tests/test_gate_execution.py tests/test_gate_executable_resolution.py tests/test_gate_timeout_diagnosis.py tests/test_validation_selection_reuse.py tests/test_contract_feasibility.py tests/test_github_task_sources.py tests/test_source_admission_publication.py tests/test_task_recovery.py::test_advance_baseline_refuses_active_claim_running_execution_and_integration tests/test_review_disposition.py tests/test_step_progress.py tests/test_honest_delivery.py tests/test_reliable_delivery_end_to_end.py tests/test_delivery_identity.py tests/test_delivery_followup.py tests/test_efficiency.py
      - name: Provider context and edit scope
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: |
          . .stagemesh\tooling\venv\Scripts\Activate.ps1
          python -m pytest -q tests/test_research_context.py tests/test_change_contracts.py tests/test_agent_skills.py

      - name: Research, planning and adverse evidence pipeline
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_research_stage.py tests/test_research_tree_recovery.py tests/test_research_crash_ownership.py tests/test_execution_timing.py tests/test_research_cleanup_ownership.py tests/test_spec_planning_gate.py tests/test_adverse_review_gate.py tests/test_distinct_review_roles.py tests/test_adverse_review_policy.py tests/test_e2e_evidence.py tests/test_e2e_remediation.py tests/test_tool_failure_recovery.py tests/test_tool_failure_evidence.py tests/test_runtime_tool_evidence.py tests/test_spec_integrity_adapter.py tests/test_spec_governance_gate.py tests/test_spec_audit.py tests/test_spec_integrity_acceptance.py tests/test_batched_ci.py tests/test_security_evidence_boundaries.py

      - name: Operator activity contract and read-only API
        if: ${{ steps.validation-plan.outputs.mode == 'full' || steps.validation-plan.outputs.mode == 'operator' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_operator_ui_contract.py tests/test_operator_api.py tests/test_task_detail_api.py tests/test_execution_detail_api.py tests/test_activity.py tests/test_activity_cli.py tests/test_activity_evidence.py tests/test_activity_periods.py tests/test_api_server.py tests/test_ui_launcher.py tests/test_ui_assets.py tests/test_ui_browser_behavior.py tests/test_ui_error_policy.py tests/test_windows_user_installer.py tests/test_operator_report.py
      - name: Operator control and isolated project acceptance
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_operator_control.py tests/test_operator_control_api.py tests/test_operator_projects.py tests/test_operator_project_cli.py tests/test_operator_control_ui.py
      - name: Exact-label selector and scoped automatic recovery
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_task_selection.py tests/test_label_selector_admission.py tests/test_selection_scope.py tests/test_queue_run.py::test_parallel_label_selector_is_enforced_at_stage_admission_after_selection tests/test_queue_run.py::test_serial_label_selector_is_enforced_at_stage_admission_after_selection tests/test_queue_run.py::test_label_removed_after_ranking_blocks_auto_planning_for_a_no_contract_task tests/test_queue_run.py::test_queue_label_selector_runs_only_in_label_and_never_recovers_out_of_label_blocked_tasks tests/test_blocked_recovery.py::test_label_selector_scopes_automatic_recovery_to_in_label_tasks tests/test_blocked_recovery.py::test_serial_run_ready_with_label_selector_does_not_recover_out_of_label_blocked_task

