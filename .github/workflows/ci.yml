name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run OSS boundary scan
        run: |
          python -c "
          from build_coordinator.oss_boundary import evaluate_boundary, format_failure
          allowed, unexpected = evaluate_boundary()
          if unexpected:
              raise SystemExit(format_failure(unexpected))
          print(f'Boundary clean. {len(allowed)} documented exceptions (must be 0 for OSS).')
          assert len(allowed) == 0, f'DOCUMENTED_EXCEPTIONS not empty: {allowed}'
          "

      - name: Import smoke check
        run: |
          python -c "import build_coordinator.cli; print('CLI import: OK')"
          python -c "from build_coordinator.runner.routing import route_worker; print('routing import: OK')"
          python -c "from build_coordinator.execution.fake import FakeExecutor; print('FakeExecutor import: OK')"