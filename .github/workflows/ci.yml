name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,postgres]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run OSS boundary scan
        shell: python
        run: |
          from build_coordinator.oss_boundary import evaluate_boundary, format_failure

          allowed, unexpected = evaluate_boundary()
          if unexpected:
              raise SystemExit(format_failure(unexpected))
          print(f"Boundary clean. {len(allowed)} documented exceptions (must be 0 for OSS).")
          assert len(allowed) == 0, f"DOCUMENTED_EXCEPTIONS not empty: {allowed}"

      - name: Import smoke check
        shell: python
        run: |
          import build_coordinator.cli
          from build_coordinator.runner.routing import route_worker
          from build_coordinator.execution.fake import FakeExecutor

          print("CLI import: OK")
          print("routing import: OK")
          print("FakeExecutor import: OK")
