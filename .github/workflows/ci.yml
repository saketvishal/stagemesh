      - name: Provider context and edit scope
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_research_context.py tests/test_change_contracts.py tests/test_agent_skills.py
      - name: Research, planning and adverse evidence pipeline
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_research_stage.py tests/test_research_cleanup_ownership.py tests/test_spec_planning_gate.py tests/test_adverse_review_gate.py tests/test_adverse_review_policy.py tests/test_e2e_remediation.py tests/test_tool_failure_recovery.py tests/test_spec_governance_gate.py tests/test_batched_ci.py tests/test_security_evidence_boundaries.py
