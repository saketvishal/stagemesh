name: StageMesh CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py --editable
      - name: Focused validation policy
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_stagemesh_validation_profile.py tests/test_focused_validation.py
      - run: .stagemesh\tooling\venv\Scripts\python.exe -c "import stagemesh; print(stagemesh.__version__)"
      - run: .stagemesh\tooling\venv\Scripts\python.exe scripts/stabilization_gate.py
      - name: Declarative and executable contract invariants
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_invariant_semantics.py
      - name: Delivery and window regressions
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_fast_forward.py tests/test_run_window.py tests/test_survivor_wave.py tests/test_contract_admission.py tests/test_controlled_merge.py tests/test_candidate_environments.py tests/test_autonomy_merge_policy.py tests/test_operator_stop.py
      - name: Missing provider tool host
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_provider_acceptance.py::test_missing_tool_host_is_not_treated_as_a_working_provider tests/test_provider_acceptance.py::test_missing_tool_host_detection_ignores_ordinary_review_text tests/test_provider_acceptance.py::test_review_git_history_is_readable_without_source_object_access
      - name: Existing queue stop compatibility
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_parallel.py tests/test_queue_run.py -k "stop or pause or interrupt"
      - name: Execution budgets and review ownership
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_bounded_execution.py tests/test_review_terminalization.py tests/test_builtin_execution_ownership.py
      - name: Validation environment and fallback progress
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_diagnosis.py tests/test_run_window_progress.py
      - name: Provider context and edit scope
        run: |
          . .stagemesh\tooling\venv\Scripts\Activate.ps1
          python -m pytest -q tests/test_research_context.py tests/test_change_contracts.py tests/test_agent_skills.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py --editable
      - run: .stagemesh/tooling/venv/bin/python -c "import stagemesh; print(stagemesh.__version__)"
      - name: Focused validation policy
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_stagemesh_validation_profile.py tests/test_focused_validation.py
      - run: .stagemesh/tooling/venv/bin/python scripts/stabilization_gate.py
      - name: Declarative and executable contract invariants
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_invariant_semantics.py
      - name: Delivery and window regressions
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_fast_forward.py tests/test_run_window.py tests/test_survivor_wave.py tests/test_contract_admission.py tests/test_controlled_merge.py tests/test_candidate_environments.py tests/test_autonomy_merge_policy.py tests/test_operator_stop.py
      - name: Missing provider tool host
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_provider_acceptance.py::test_missing_tool_host_is_not_treated_as_a_working_provider tests/test_provider_acceptance.py::test_missing_tool_host_detection_ignores_ordinary_review_text tests/test_provider_acceptance.py::test_review_git_history_is_readable_without_source_object_access
      - name: Existing queue stop compatibility
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_parallel.py tests/test_queue_run.py -k "stop or pause or interrupt"
      - name: Execution budgets and review ownership
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_bounded_execution.py tests/test_review_terminalization.py tests/test_builtin_execution_ownership.py
      - name: Validation environment and fallback progress
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_diagnosis.py tests/test_run_window_progress.py
      - name: Provider context and edit scope
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_research_context.py tests/test_change_contracts.py tests/test_agent_skills.py
