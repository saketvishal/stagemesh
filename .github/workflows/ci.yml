name: StageMesh CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py --editable
      - name: Focused validation policy
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_stagemesh_validation_profile.py tests/test_focused_validation.py
      - run: .stagemesh\tooling\venv\Scripts\python.exe -c "import stagemesh; print(stagemesh.__version__)"
      - run: .stagemesh\tooling\venv\Scripts\python.exe scripts/stabilization_gate.py
      - name: Declarative and executable contract invariants
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_invariant_semantics.py
      - name: Delivery and window regressions
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_fast_forward.py tests/test_landing_recovery.py tests/test_run_window.py tests/test_continuous_capacity.py tests/test_source_sync_preserves_progress.py tests/test_operator_report.py tests/test_survivor_wave.py tests/test_contract_admission.py tests/test_controlled_merge.py tests/test_candidate_environments.py tests/test_workspace_environment_repair.py tests/test_autonomy_merge_policy.py tests/test_operator_stop.py
      - name: Isolated validation temporary directories
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_gate_temp_isolation.py tests/test_validation_deadline_clock.py
      - name: Missing provider tool host
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_provider_acceptance.py::test_missing_tool_host_is_not_treated_as_a_working_provider tests/test_provider_acceptance.py::test_missing_tool_host_detection_ignores_ordinary_review_text tests/test_provider_acceptance.py::test_review_git_history_is_readable_without_source_object_access
      - name: Existing queue stop compatibility
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_parallel.py tests/test_queue_run.py -k "stop or pause or interrupt"
      - name: Execution budgets and review ownership
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_bounded_execution.py tests/test_review_terminalization.py tests/test_builtin_execution_ownership.py tests/test_provider_cleanup_confirmation.py tests/test_external_provider_cleanup.py tests/test_concurrent_provider_termination.py tests/test_review_workspace_retention.py tests/test_pid_cleanup_proof.py
      - name: Continuous driver control and recovery
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_continuous_driver.py tests/test_driver_control_races.py tests/test_driver_cleanup_fence.py
      - name: Validation environment and fallback progress
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_diagnosis.py tests/test_run_window_progress.py
      - name: Reliable execution, validation and delivery
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_gate_execution.py tests/test_gate_executable_resolution.py tests/test_gate_timeout_diagnosis.py tests/test_validation_selection_reuse.py tests/test_contract_feasibility.py tests/test_github_task_sources.py tests/test_source_admission_publication.py tests/test_task_recovery.py::test_advance_baseline_refuses_active_claim_running_execution_and_integration tests/test_review_disposition.py tests/test_step_progress.py tests/test_honest_delivery.py tests/test_reliable_delivery_end_to_end.py tests/test_delivery_identity.py tests/test_delivery_followup.py tests/test_efficiency.py
      - name: Provider context and edit scope
        run: |
          . .stagemesh\tooling\venv\Scripts\Activate.ps1
          python -m pytest -q tests/test_research_context.py tests/test_change_contracts.py tests/test_agent_skills.py

      - name: Research, planning and adverse evidence pipeline
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_research_stage.py tests/test_research_cleanup_ownership.py tests/test_spec_planning_gate.py tests/test_adverse_review_gate.py tests/test_adverse_review_policy.py tests/test_e2e_remediation.py tests/test_tool_failure_recovery.py tests/test_spec_governance_gate.py tests/test_batched_ci.py tests/test_security_evidence_boundaries.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
