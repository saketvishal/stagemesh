name: StageMesh CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py
      - run: .stagemesh\bin\stagemesh.cmd --version
      - run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest tests/test_provider_pool.py::test_verbose_workspace_mutation_is_quarantined_without_provider_cooldown -q

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py
      - run: ./.stagemesh/bin/stagemesh --version
      - run: .stagemesh/tooling/venv/bin/python -m pytest tests/test_provider_pool.py::test_verbose_workspace_mutation_is_quarantined_without_provider_cooldown -q
