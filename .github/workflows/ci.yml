name: StageMesh CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . --target .tmp-install --no-cache-dir
      - run: python -m compileall -q src scripts build_backend.py
      - run: python scripts/invariants.py
      - run: python scripts/provider_acceptance.py
      - run: python scripts/github_acceptance.py
      - run: python scripts/acceptance.py
      - run: python scripts/live_acceptance.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . --target .tmp-install --no-cache-dir
      - run: python -m compileall -q src scripts build_backend.py
      - run: python scripts/invariants.py
      - run: python scripts/provider_acceptance.py
      - run: python scripts/github_acceptance.py
      - run: python scripts/acceptance.py
      - run: python scripts/live_acceptance.py
