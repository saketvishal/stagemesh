name: StageMesh CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py
      - run: .stagemesh\bin\stagemesh.cmd --project . ci --future-feature-gate

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/bootstrap_stagemesh.py
      - run: ./.stagemesh/bin/stagemesh --project . ci --future-feature-gate
