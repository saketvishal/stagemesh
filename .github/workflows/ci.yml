name: StageMesh CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . --target .tmp-install --no-cache-dir
      - run: python -m stagemesh.cli --project . ci --future-feature-gate

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . --target .tmp-install --no-cache-dir
      - run: python -m stagemesh.cli --project . ci --future-feature-gate
