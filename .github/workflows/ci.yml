      - name: Continuous driver control and recovery
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_continuous_driver.py tests/test_driver_control_races.py tests/test_driver_cleanup_fence.py
      - name: Validation environment and fallback progress
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_diagnosis.py tests/test_run_window_progress.py
      - name: Reliable execution, validation and delivery
