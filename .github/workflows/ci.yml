name: StageMesh CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run the authoritative complete regression
        required: true
        default: full
        type: choice
        options: [full]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute audited validation plan
        id: validation-plan
        env:
          STAGEMESH_CI_EVENT: ${{ github.event_name }}
          STAGEMESH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          STAGEMESH_CI_FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/ci_validation_plan.py --plan-file .stagemesh-ci-plan.json
      - name: Attribution and static range policy
        env:
          STAGEMESH_CI_EVENT: ${{ github.event_name }}
          STAGEMESH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python scripts/check_ci_range.py
      - run: python scripts/bootstrap_stagemesh.py --editable
      - name: Focused validation policy
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_stagemesh_validation_profile.py tests/test_focused_validation.py tests/test_docs_links.py
      - run: .stagemesh\tooling\venv\Scripts\python.exe -c "import stagemesh; print(stagemesh.__version__)"
      - name: Declarative and executable contract invariants
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_invariant_semantics.py
      - name: Audited component tests
        if: ${{ steps.validation-plan.outputs.mode == 'component' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe scripts/run_ci_component_tests.py --plan .stagemesh-ci-plan.json --os windows
      - name: Stabilization matrix
        if: ${{ steps.validation-plan.outputs.mode == 'operator' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe scripts/stabilization_gate.py
      - name: Operator activity contract and read-only API
        if: ${{ steps.validation-plan.outputs.mode == 'operator' }}
        run: .stagemesh\tooling\venv\Scripts\python.exe -m pytest -q tests/test_operator_ui_contract.py tests/test_operator_api.py tests/test_operator_doctor_api.py tests/test_operator_providers_api.py tests/test_operator_attention_api.py tests/test_operator_diagnostics_api.py tests/test_task_detail_api.py tests/test_execution_detail_api.py tests/test_activity.py tests/test_activity_cli.py tests/test_activity_evidence.py tests/test_activity_periods.py tests/test_api_server.py tests/test_ui_launcher.py tests/test_ui_assets.py tests/test_ui_browser_behavior.py tests/test_ui_error_policy.py tests/test_windows_user_installer.py tests/test_operator_report.py
      - name: Authoritative Windows platform regression
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        env:
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Force .stagemesh\ci | Out-Null
          .stagemesh\tooling\venv\Scripts\python.exe scripts/run_regression.py --profile windows-essential --jobs 1 --journal .stagemesh\ci\windows-regression-journal.jsonl --report .stagemesh\ci\windows-regression-report.json
      - name: Publish Windows platform evidence
        if: ${{ always() && steps.validation-plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-windows-${{ github.run_attempt }}
          path: |
            .stagemesh/ci/windows-regression-report.json
            .stagemesh/ci/windows-regression-journal.jsonl
            .stagemesh-ci-plan.json
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compute audited validation plan
        id: validation-plan
        env:
          STAGEMESH_CI_EVENT: ${{ github.event_name }}
          STAGEMESH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          STAGEMESH_CI_FORCE_FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/ci_validation_plan.py --plan-file .stagemesh-ci-plan.json
      - name: Attribution and static range policy
        env:
          STAGEMESH_CI_EVENT: ${{ github.event_name }}
          STAGEMESH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python scripts/check_ci_range.py
      - run: python scripts/bootstrap_stagemesh.py --editable
      - run: .stagemesh/tooling/venv/bin/python -c "import stagemesh; print(stagemesh.__version__)"
      - name: Focused validation policy
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_stagemesh_validation_profile.py tests/test_focused_validation.py tests/test_docs_links.py
      - name: Declarative and executable contract invariants
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_invariant_semantics.py
      - name: Audited component tests
        if: ${{ steps.validation-plan.outputs.mode == 'component' }}
        run: .stagemesh/tooling/venv/bin/python scripts/run_ci_component_tests.py --plan .stagemesh-ci-plan.json --os linux
      - name: Stabilization matrix
        if: ${{ steps.validation-plan.outputs.mode == 'operator' }}
        run: .stagemesh/tooling/venv/bin/python scripts/stabilization_gate.py
      - name: Operator activity contract and read-only API
        if: ${{ steps.validation-plan.outputs.mode == 'operator' }}
        run: .stagemesh/tooling/venv/bin/python -m pytest -q tests/test_operator_ui_contract.py tests/test_operator_api.py tests/test_operator_doctor_api.py tests/test_operator_providers_api.py tests/test_operator_attention_api.py tests/test_operator_diagnostics_api.py tests/test_task_detail_api.py tests/test_execution_detail_api.py tests/test_activity.py tests/test_activity_cli.py tests/test_activity_evidence.py tests/test_activity_periods.py tests/test_api_server.py tests/test_ui_launcher.py tests/test_ui_assets.py tests/test_ui_browser_behavior.py tests/test_ui_error_policy.py tests/test_windows_user_installer.py tests/test_operator_report.py
      - name: Authoritative complete regression
        if: ${{ steps.validation-plan.outputs.mode == 'full' }}
        env:
          STAGEMESH_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          mkdir -p .stagemesh/ci
          .stagemesh/tooling/venv/bin/python scripts/run_regression.py --jobs 6 --journal .stagemesh/ci/linux-regression-journal.jsonl --report .stagemesh/ci/linux-regression-report.json
      - name: Publish complete regression evidence
        if: ${{ always() && steps.validation-plan.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-linux-${{ github.run_attempt }}
          path: |
            .stagemesh/ci/linux-regression-report.json
            .stagemesh/ci/linux-regression-journal.jsonl
            .stagemesh-ci-plan.json
          if-no-files-found: error
          retention-days: 14
