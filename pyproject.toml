[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "stagemesh"
version = "0.1.0"
description = "Provider-neutral control plane for autonomous software engineering lifecycles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StageMesh Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
stagemesh = "stagemesh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
