[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "stagemesh"
version = "0.6.12"
description = "Provider-neutral control plane for autonomous software engineering lifecycles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StageMesh Contributors" }]
keywords = ["software-engineering", "automation", "agents", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ['tzdata>=2025.2; platform_system == "Windows"']

[project.urls]
Homepage = "https://github.com/saketvishal/stagemesh"
Repository = "https://github.com/saketvishal/stagemesh"
Issues = "https://github.com/saketvishal/stagemesh/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.13,<2",
    "vulture>=2.14,<3",
]

[project.scripts]
stagemesh = "stagemesh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = [
    "src/stagemesh/quality_policy.py",
    "scripts/quality_gate.py",
]
