# Real coding-agent end-to-end demo (SM-012).
#
# This file is a genuine `.stagemesh/project.yaml` body: copy it verbatim to
# `<scratch-repo>/.stagemesh/project.yaml` and it loads through the real
# project loader (`build_coordinator.project.definition.load_project`) and
# the real worker-template expander
# (`build_coordinator.project.runtime.build_runner_config`) exactly like any
# other StageMesh project. `tests/test_real_agent_end_to_end.py` does exactly
# that, so this manifest is proven executable through the same loader path
# it documents, not just described.
#
# Worker commands are intentionally NOT written as a literal
# `["${SOME_ENV_VAR}"]` array: StageMesh's project loader passes command
# entries through `tuple(str(part) for part in template["command"])` with no
# `${VAR}` shell-style expansion, so a literal placeholder like that would be
# executed as-is (a non-existent binary named `${SOME_ENV_VAR}`), not
# substituted. The supported way to point a worker template at a real,
# operator-installed coding-agent CLI without hardcoding a vendor binary name
# in project.yaml is `runtime: <id>`: the loader (`_resolve_runtime_template`
# in build_coordinator/project/runtime.py) looks up `<id>` in
# `build_coordinator.agents.profiles.PROFILES` and supplies StageMesh's own
# wrapper command,
#   `[sys.executable, "-m", "build_coordinator.agents.wrapper", "--runtime", "<id>"]
# which in turn resolves and drives the real, operator-installed CLI (found
# via PATH, e.g. `claude`) headlessly. This is the same mechanism every other
# StageMesh worker template uses; "operator environment" here means "the
# named runtime's CLI is installed and authenticated on the machine running
# this project", not a bespoke environment variable.
schema_version: 1
id: real-agent-demo
name: Real Agent End-to-End Demo
repository:
  main_ref: main
execution:
  concurrency: 1
  reviewers: 1
  default_review_policy: INDEPENDENT
workers:
  builder:
    runtime: claude
    timeout_seconds: 600
  reviewer:
    runtime: claude
    timeout_seconds: 600
  # INTEGRATION is StageMesh's own deterministic merge step (the SCM_OPERATOR
  # role, `build_coordinator.execution.git_integrator.GitIntegrationExecutor`)
  # by design: merging an already-reviewed commit is mechanical and does not
  # need a model (see that module's docstring). `adapter: builtin-git` is
  # also the default `build_runner_config` falls back to when a project
  # declares no `workers.integration` template at all; it is listed here for
  # clarity. This is a real execution against the real scratch git
  # repository -- a real `git merge --no-ff` that advances `main` -- not a
  # scripted stand-in.
  integration:
    adapter: builtin-git
    provider: stagemesh
notes: >
  Validates real coding-agent execution end to end on a disposable scratch
  repository: one BUILDER execution and one independent REVIEWER execution
  (distinct worker id, per INDEPENDENT review policy) against a real,
  operator-installed `claude` CLI via the SubprocessExecutor adapter, then
  one INTEGRATION execution via StageMesh's real (non-scripted) git
  integrator that merges the reviewed commit into main. All three are
  launched from these worker templates via `build_runner_config` plus the
  operator's installed/authenticated `claude` CLI -- no per-run manual
  worktree or worker choice. See tests/test_real_agent_end_to_end.py for the
  automated harness that drives this scenario and records durable evidence
  under docs/evidence/real_agent_runs/, and
  docs/evidence/REAL_AGENT_EXECUTION_ACCEPTANCE.md for what is being proven.
