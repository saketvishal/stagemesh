# StageMesh developing StageMesh: the same project mechanism any other project
# uses. Definitions are version-controlled here; runtime state lives in the
# git-ignored state_dir.
schema_version: 1
id: stagemesh
name: StageMesh
aliases: [stagemesh, build-coordinator]

repository:
  main_ref: main
  remote_name: origin

state_dir: .build-coordinator

execution:
  concurrency: 1
  reviewers: 1
  default_review_policy: INDEPENDENT

workers:
  builder:
    provider: local-agent
    adapter: subprocess
    command: [python, -P, examples/stdin_print_cli_wrapper.py]
    timeout_seconds: 3600
    env:
      BUILD_COORDINATOR_PRINT_CLI: {source: environment, variable: STAGEMESH_AGENT_CLI}
  reviewer:
    provider: local-agent
    adapter: subprocess
    command: [python, -P, examples/stdin_print_cli_wrapper.py]
    timeout_seconds: 1800
    env:
      BUILD_COORDINATOR_PRINT_CLI: {source: environment, variable: STAGEMESH_AGENT_CLI}
  integration:
    provider: local-agent
    adapter: subprocess
    command: [python, -P, examples/stdin_print_cli_wrapper.py]
    timeout_seconds: 1800
    env:
      BUILD_COORDINATOR_PRINT_CLI: {source: environment, variable: STAGEMESH_AGENT_CLI}

task_sources:
  github:
    enabled: false
    repo: saketvishal/stagemesh
